# Nome global na Fly. Se já existir, troque antes do primeiro deploy.
app = "torneio-commander-500"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "43127"
  NODE_ENV = "production"
  TORNEIO_DB_PATH = "/data/torneio.sqlite"

[http_service]
  internal_port = 43127
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "torneio_data"
  destination = "/data"
